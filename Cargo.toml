[package]
name = "smart-relay"
version = "0.1.0"
edition = "2021"
authors = ["smart-relay contributors"]
description = "AI-assisted proxy/vpn orchestrator with Ollama-driven recommendations"
license = "MIT"
repository = "https://example.com/smart-relay"

[[bin]]
name = "smart-relay"
path = "src/main.rs"

[[bin]]
name = "smart-relay-gui"
path = "src/gui/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.27", default-features = false, features = ["default_fonts"] }
once_cell = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
egui-chinese-font = "0.1"
chrono = "0.4"
futures = "0.3"
pnet = "0.35"
zip = "0.6"
tempfile = "3"
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.50"
winapi = { version = "0.3", features = ["wininet", "winuser"] }

[dev-dependencies]
tower = "0.5"

